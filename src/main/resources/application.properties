# Credenciales y secretos: SIEMPRE por variable de entorno (sin valores por defecto en el código fuente).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/proyecto_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.flyway.enabled=true

app.jwt.secret=${APP_JWT_SECRET}

gestopago.auth.url=https://gestopago.portalventas.net
gestopago.auth.id-distribuidor=83
gestopago.auth.codigo-dispositivo=GPS83-TPV-17
gestopago.auth.password=${GESTOPAGO_AUTH_PASSWORD}
# El proveedor exige UN token por día (vigencia 24 h): se revisa cada hora pero solo se renueva si tiene más de 23 h.
gestopago.auth.refresh-rate-ms=3600000
gestopago.auth.edad-maxima-horas=23
gestopago.service.url=https://gestopago.portalventas.net
# X-API-Key opcional asignada por el proveedor.
gestopago.api-key=${GESTOPAGO_API_KEY:}
# Llave e IV (Base64) para cifrar el payload (AES-256-CBC). Se definen por variable de entorno.
gestopago.crypto.key=${GESTOPAGO_CRYPTO_KEY:}
gestopago.crypto.iv=${GESTOPAGO_CRYPTO_IV:}
gestopago.tx.unidad=083
gestopago.tx.zona-horaria=America/Mexico_City

# Timeouts del cliente HTTP hacia GestoPago. El proveedor responde CODIGO 82 tras 62 s sin respuesta,
# por eso el timeout de lectura de sendTx/confirmTx es mayor. Sin reintentos automáticos (operación financiera).
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=15000
spring.cloud.openfeign.client.config.gestoPagoService.connect-timeout=5000
spring.cloud.openfeign.client.config.gestoPagoService.read-timeout=70000

# Reglas de negocio del pago
pagos.monto-maximo=20000.00
pagos.pin.intentos-maximos=5
pagos.pin.bloqueo-minutos=15
# Conciliación: confirmTx no puede ejecutarse antes de 62 s del sendTx ni después de 24 h.
pagos.conciliacion.espera-minima-segundos=70
pagos.conciliacion.ventana-horas=24
pagos.conciliacion.pendiente-obsoleto-segundos=120
pagos.conciliacion.intervalo-ms=120000

spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000

# Health check sin detalle de Redis caído
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=false
